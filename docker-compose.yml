services:
  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://returns:returns@db:5432/returns
      RETURNS_EVIDENCE_DIR: /app/data/evidence
      # Offline deterministic model profile by default; set
      # RETURNS_MODEL_PROFILE=hosted-bedrock plus AWS credentials to
      # wire a live Bedrock model (see .env.example).
      RETURNS_MODEL_PROFILE: offline
    depends_on:
      - db
      - minio
    volumes:
      - agent-data:/app/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: returns
      POSTGRES_PASSWORD: returns
      POSTGRES_DB: returns
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  # SeaweedFS provides the S3-compatible evidence store locally; the
  # service name stays `minio` after the portfolio convention.
  minio:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -s3.port=8333 -dir=/data"
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

volumes:
  agent-data:
  pg-data:
  s3-data:
